name: sayren_store_sdk
description: Dart SDK for the sayren admin API — products, orders, claims, settings and webhook signatures. Same API as @sayren/store-sdk.
version: 0.1.0
repository: https://github.com/avarcorp/sayren-flutter
issue_tracker: https://github.com/avarcorp/sayren-flutter/issues
topics:
  - ecommerce
  - sdk
  - api
  - webhooks

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  # 업로드 파일(Node `Blob`·`File` 자리)
  cross_file: ^0.3.4+2
  # PKCE(S256) — OAuth 로그인
  crypto: ^3.0.7
  http: ^1.2.0
  # 직접 입력값 NFC 정규화(Node `String.prototype.normalize`)
  unorm_dart: ^0.3.2

dev_dependencies:
  test: ^1.25.0
